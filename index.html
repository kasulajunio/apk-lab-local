<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APK LAB</title><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><style>body{margin:0;background:#111b2c;color:#eef7ff;font:16px system-ui}.w{max-width:900px;margin:auto;padding:28px}.card{background:#1b2a40;border:1px solid #3a5373;border-radius:16px;padding:20px;margin:18px 0}h1{font-size:42px;margin:0}.muted{color:#afbdd0}.drop{display:block;padding:45px;border:2px dashed #64a1cf;border-radius:12px;text-align:center;cursor:pointer}input{display:none}.hide{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.list{max-height:430px;overflow:auto}button{background:#315274;color:white;border:0;border-radius:8px;padding:10px 13px;margin:4px;cursor:pointer}.file{display:block;width:100%;margin:0;text-align:left;background:transparent;border-radius:0;border-bottom:1px solid #304764}textarea{width:100%;height:300px;box-sizing:border-box;background:#0c1523;color:#d7eaff;border:1px solid #46688e;border-radius:8px;padding:10px}.green{background:#287051}.warn{background:#463719;padding:12px;border-left:3px solid #ffc35e}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:32px}}</style><body><main class="w"><h1>APK LAB</h1><p class="muted">Analise e personalize APKs que são seus, direto no navegador.</p><section class="card"><label class="drop">Toque para escolher um APK ou ZIP<input id="pick" type="file" accept=".apk,.zip"></label></section><section id="app" class="hide"><section class="card"><button data="files">Arquivos</button><button data="brand">Nome e ícone</button><button data="audit">Auditoria</button><button data="export">Exportar</button></section><section id="files" class="pane grid"><div class="card"><b id="count"></b><div class="list" id="list"></div></div><div class="card"><b id="title">Prévia</b><textarea id="editor" disabled placeholder="Escolha arquivo de texto"></textarea><p><button id="save" disabled>Salvar alteração</button></p></div></section><section id="brand" class="pane hide"><div class="card"><b>Alterar nome</b><p><input id="name" placeholder="Novo nome"><select id="xml"></select><button id="rename">Aplicar</button></p><b>Trocar ícone</b><p><select id="icon"></select><input id="image" type="file" accept="image/png,image/jpeg,image/webp"><button id="replace">Substituir</button></p></div></section><section id="audit" class="pane hide"><div class="card" id="report"></div></section><section id="export" class="pane hide"><div class="card"><p class="warn">A cópia gerada perde a assinatura. Assine com a chave do seu próprio app antes de instalar.</p><div id="log" class="muted"></div><button id="download" class="green" disabled>Baixar cópia modificada</button><button id="reset">Descartar alterações</button></div></section></section></main><script>const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];let z,all=[],mods=new Map(),cur,base="app";const tx=/\.(xml|json|txt|html|js|css|properties|md)$/i;function u(){q("#log").textContent=mods.size?mods.size+" arquivo(s) alterado(s).":"Nenhuma alteração ainda.";q("#download").disabled=!mods.size}async function load(f){try{z=await JSZip.loadAsync(f);base=f.name.replace(/\.(apk|zip)$/i,"");all=Object.values(z.files).filter(x=>!x.dir);q("#app").classList.remove("hide");q("#count").textContent=all.length+" arquivos";q("#list").innerHTML=all.map(x=>"<button class=\"file\" data-n=\""+x.name+"\">"+x.name+"</button>").join("");q("#xml").innerHTML="<option value=\"\">XML de strings</option>"+all.filter(x=>/^res\/values.*\.xml$/i.test(x.name)).map(x=>"<option>"+x.name+"</option>").join("");q("#icon").innerHTML="<option value=\"\">Imagem no APK</option>"+all.filter(x=>/^res\/(mipmap|drawable).*\.(png|webp|jpg|jpeg)$/i.test(x.name)).map(x=>"<option>"+x.name+"</option>").join("");q("#report").innerHTML="<b>Auditoria rápida</b><p>DEX: "+all.filter(x=>x.name.startsWith("classes")).length+" arquivos de código.</p><p>Bibliotecas nativas: "+all.filter(x=>x.name.startsWith("lib/")&&x.name.endsWith(".so")).length+".</p>";qa(".file").forEach(b=>b.onclick=async()=>{cur=b.dataset.n;q("#title").textContent=cur;if(!tx.test(cur)){q("#editor").value="";q("#editor").disabled=true;q("#save").disabled=true;return}q("#editor").value=mods.has(cur)?mods.get(cur):await z.file(cur).async("string");q("#editor").disabled=false;q("#save").disabled=false});mods.clear();u()}catch(e){alert("Nao consegui abrir esse arquivo.")}}q("#pick").onchange=e=>load(e.target.files[0]);q("#save").onclick=()=>{if(cur){mods.set(cur,q("#editor").value);u()}};q("#rename").onclick=async()=>{let p=q("#xml").value,n=q("#name").value.trim();if(!p||!n)return alert("Escolha XML e nome.");let s=mods.has(p)?mods.get(p):await z.file(p).async("string");if(!/app_name/.test(s))return alert("app_name nao encontrado.");mods.set(p,s.replace(/(<string\s+name=\"app_name\"[^>]*>)[\s\S]*?(<\/string>)/i,"$1"+n+"$2"));u()};q("#replace").onclick=async()=>{let p=q("#icon").value,f=q("#image").files[0];if(!p||!f)return alert("Escolha destino e imagem.");mods.set(p,await f.arrayBuffer());u()};q("#reset").onclick=()=>{mods.clear();u()};q("#download").onclick=async()=>{let o=new JSZip;for(let f of all)if(!/^META-INF\/.*\.(RSA|DSA|EC|SF)$/i.test(f.name))o.file(f.name,mods.has(f.name)?mods.get(f.name):await f.async("uint8array"));let a=document.createElement("a");a.href=URL.createObjectURL(await o.generateAsync({type:"blob",compression:"DEFLATE"}));a.download=base+"-editado-sem-assinatura.apk";a.click()};qa("button[data]").forEach(b=>b.onclick=()=>{qa(".pane").forEach(x=>x.classList.add("hide"));q("#"+b.dataset).classList.remove("hide")});</script></body></html>
